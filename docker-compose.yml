version: '3.8'

volumes:
  db_data: {}

networks:
  application-network:
    driver: bridge

services:

  db_postgresql:
    image: postgres:15
    container_name: hospital-manager-db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    restart: always
    networks:
      - application-network
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"

  kafka:
    image: apache/kafka:latest
    container_name: hospital-manager-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@hospital-manager-kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  gerenciador-usuarios-back-end:
    build:
      context: .
      dockerfile: services/gerenciador-usuarios/Dockerfile
    container_name: gerenciador-usuarios-app
    ports:
      - "${API_PORT}:8091"
    restart: no
    networks:
      - application-network
    environment:
      API_PORT_DEFAULT: ${API_PORT_GERENCIAR_USUARIOS}
      API_NAME_DEFAULT: ${API_NAME_GERENCIAR_USUARIOS}
      POSTGRES_DB_HOST: db_postgresql
      POSTGRES_DB_PORT: ${DB_PORT}
      POSTGRES_DB_NAME: ${DB_NAME}
      POSTGRES_DB_USER: ${DB_USER}
      POSTGRES_DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db_postgresql

  notificar-usuarios-back-end:
    build:
      context: .
      dockerfile: services/notificar-usuarios/Dockerfile
    container_name: notificar-usuarios-app
    ports:
      - "${API_PORT}:8092"
    restart: no
    networks:
      - application-network
    environment:
      API_PORT_DEFAULT: ${API_PORT_NOTIFICAR_USUARIOS}
      API_NAME_DEFAULT: ${API_NAME_NOTIFICAR_USUARIOS}
      BOOSTRATP_SERVERS: kafka:9092
    depends_on:
      - kafka