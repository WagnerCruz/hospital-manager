server:
  port: 8091
  servlet.context-path: /gerenciar-usuarios

spring:
  application:
    name: gerenciar-usuarios

  messages:
    basename: messages
    encoding: UTF-8

  # Datasource Configuration
  sql.init:
    mode: always
    schema-locations: classpath:scripts/schemas/*.sql
    data-locations: classpath:scripts/data/*.sql
  datasource:
    url: jdbc:h2:mem:hospital-manager;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: admin
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate.ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  kafka:
    producers:
      usuario:
        criado.topic: usuario-criado
        atualizado.topic: usuario-atualizado
      agendamento:
        criado.topic: agendamento-criado
        atualizado.topic: agendamento-atualizado
