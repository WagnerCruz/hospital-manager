server:
  port: ${API_PORT_DEFAULT:8091}
  servlet.context-path: /gerenciar-usuarios

spring:
  application:
    name: ${API_NAME_DEFAULT:gerenciar-usuarios}

  messages:
    basename: messages
    encoding: UTF-8

  # Datasource Configuration
  datasource:
    url: jdbc:postgresql://${POSTGRES_DB_HOST:localhost}:${POSTGRES_DB_PORT:5432}/${POSTGRES_DB_NAME:hospitalmanager}
    driverClassName: org.postgresql.Driver
    username: ${POSTGRES_DB_USER:admin}
    password: ${POSTGRES_DB_PASSWORD:admin}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate.ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  kafka:
    producers:
      usuario:
        criado.topic: usuario-criado
        atualizado.topic: usuario-atualizado
      agendamento:
        criado.topic: agendamento-criado
        atualizado.topic: agendamento-atualizado
