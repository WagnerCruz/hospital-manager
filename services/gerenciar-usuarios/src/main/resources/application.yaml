server:
  port: 8091

spring:
  application:
    name: hospital-manager/gerenciar-usuarios

  # Datasource Configuration
  sql.init:
    mode: always
    schema-locations: classpath:scripts/*.sql
#    data-locations: classpath:scripts/*.sql
  datasource:
    url: jdbc:h2:mem:hospital-manager;INIT=CREATE SCHEMA IF NOT EXISTS hospital;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
    h2:
      console:
        enabled: true
        path: /h2-console
    jpa:
      database-platform: org.hibernate.dialect.H2Dialect
      hibernate:
        ddl-auto: validate
      show-sql: true

senha.min: 8


